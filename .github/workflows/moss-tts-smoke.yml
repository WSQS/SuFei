name: MOSS-TTS Smoke Test

on:
  pull_request:
    paths:
      - 'app/src/main/java/dev/wceng/sufei/fork/sopho/data/tts/moss/**'
      - 'app/src/test/java/dev/wceng/sufei/fork/sopho/data/tts/moss/**'
      - '.github/workflows/moss-tts-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache MOSS models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: ~/.cache/moss-models
          key: moss-models-v1

      - name: Download MOSS models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/moss-models/MOSS-TTS-Nano-100M-ONNX
          mkdir -p ~/.cache/moss-models/MOSS-Audio-Tokenizer-Nano-ONNX

          TTS_URL="https://huggingface.co/OpenMOSS-Team/MOSS-TTS-Nano-100M-ONNX/resolve/main"
          cd ~/.cache/moss-models/MOSS-TTS-Nano-100M-ONNX
          for f in browser_poc_manifest.json tts_browser_onnx_meta.json tokenizer.model \
                   moss_tts_prefill.onnx moss_tts_decode_step.onnx \
                   moss_tts_local_fixed_sampled_frame.onnx \
                   moss_tts_local_cached_step.onnx moss_tts_local_decoder.onnx \
                   moss_tts_global_shared.data moss_tts_local_shared.data; do
            echo "Downloading $f ..."
            curl -fSL -o "$f" "$TTS_URL/$f"
          done

          CODEC_URL="https://huggingface.co/OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano-ONNX/resolve/main"
          cd ~/.cache/moss-models/MOSS-Audio-Tokenizer-Nano-ONNX
          for f in codec_browser_onnx_meta.json \
                   moss_audio_tokenizer_decode_full.onnx \
                   moss_audio_tokenizer_decode_step.onnx \
                   moss_audio_tokenizer_decode_shared.data; do
            echo "Downloading $f ..."
            curl -fSL -o "$f" "$CODEC_URL/$f"
          done

      - name: Run smoke test
        run: |
          ./gradlew app:testDebugUnitTest \
            --tests "dev.wceng.sufei.fork.sopho.data.tts.moss.MossOnnxEngineSmokeTest" \
            -DMOSS_MODEL_DIR="$HOME/.cache/moss-models"

      - name: Upload WAV samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-samples
          path: app/build/tts-samples/*.wav
          if-no-files-found: warn
          retention-days: 14
